<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Batch Drafts</title><desc id="desc">Share context across independent reviews in one bounded prompt.</desc><rect width="1200" height="330" rx="24" fill="#0b1220"/><rect x="54" y="44" width="5" height="101" rx="3" fill="#fda4af"/><text x="80" y="65" font-family="Arial,sans-serif" font-size="14" letter-spacing="4" fill="#fda4af">GENESIS / EXPLICIT WORKFLOW TOOLS</text><text x="77" y="119" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#f8fafc">Batch Drafts</text><text x="80" y="163" font-family="Arial,sans-serif" font-size="23" fill="#cbd5e1">Share context across independent reviews in one bounded prompt.</text><rect x="80" y="220" width="320" height="62" rx="12" fill="#172235"/><text x="100" y="258" font-family="Arial,sans-serif" font-size="18" fill="#fda4af">1 / Group independent tasks</text><rect x="445" y="220" width="320" height="62" rx="12" fill="#172235"/><text x="465" y="258" font-family="Arial,sans-serif" font-size="18" fill="#fda4af">2 / Share filtered context</text><rect x="810" y="220" width="320" height="62" rx="12" fill="#172235"/><text x="830" y="258" font-family="Arial,sans-serif" font-size="18" fill="#fda4af">3 / Validate each draft</text></svg>
