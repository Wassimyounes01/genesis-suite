<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Evidence Collector</title><desc id="desc">Turn scattered receipts into a reviewable completion record. Collect receipts then Check current bytes then Assemble outcome</desc><rect width="1200" height="340" rx="22" fill="#101827"/><rect x="48" y="42" width="5" height="96" rx="2" fill="#a78bfa"/><text x="76" y="62" fill="#a78bfa" font-family="Arial,sans-serif" font-size="15" letter-spacing="4">GENESIS / PORTABLE WORKFLOW SYSTEM</text><text x="73" y="111" fill="#f8fafc" font-family="Arial,sans-serif" font-size="42" font-weight="700">Evidence Collector</text><text x="76" y="156" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="21">Turn scattered receipts into a reviewable completion record.</text><rect x="76" y="220" width="320" height="65" rx="12" fill="#1e293b" stroke="#334155"/><circle cx="104" cy="252" r="14" fill="#a78bfa"/><text x="100" y="257" fill="#101827" font-family="Arial,sans-serif" font-size="14">1</text><text x="130" y="260" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="19">Collect receipts</text><path d="M 406 252 h 26 m -8 -7 l 8 7 -8 7" stroke="#a78bfa" fill="none" stroke-width="2"/><rect x="441" y="220" width="320" height="65" rx="12" fill="#1e293b" stroke="#334155"/><circle cx="469" cy="252" r="14" fill="#a78bfa"/><text x="465" y="257" fill="#101827" font-family="Arial,sans-serif" font-size="14">2</text><text x="495" y="260" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="19">Check current bytes</text><path d="M 771 252 h 26 m -8 -7 l 8 7 -8 7" stroke="#a78bfa" fill="none" stroke-width="2"/><rect x="806" y="220" width="320" height="65" rx="12" fill="#1e293b" stroke="#334155"/><circle cx="834" cy="252" r="14" fill="#a78bfa"/><text x="830" y="257" fill="#101827" font-family="Arial,sans-serif" font-size="14">3</text><text x="860" y="260" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="19">Assemble outcome</text></svg>
