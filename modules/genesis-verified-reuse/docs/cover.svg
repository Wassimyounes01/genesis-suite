<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Verified Reuse</title><desc id="desc">Reuse a current draft without inheriting its approval.</desc><rect width="1200" height="330" rx="24" fill="#0b1220"/><rect x="54" y="44" width="5" height="101" rx="3" fill="#86efac"/><text x="80" y="65" font-family="Arial,sans-serif" font-size="14" letter-spacing="4" fill="#86efac">GENESIS / EXPLICIT WORKFLOW TOOLS</text><text x="77" y="119" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#f8fafc">Verified Reuse</text><text x="80" y="163" font-family="Arial,sans-serif" font-size="23" fill="#cbd5e1">Reuse a current draft without inheriting its approval.</text><rect x="80" y="220" width="320" height="62" rx="12" fill="#172235"/><text x="100" y="258" font-family="Arial,sans-serif" font-size="18" fill="#86efac">1 / Bind exact inputs</text><rect x="445" y="220" width="320" height="62" rx="12" fill="#172235"/><text x="465" y="258" font-family="Arial,sans-serif" font-size="18" fill="#86efac">2 / Recheck persisted bytes</text><rect x="810" y="220" width="320" height="62" rx="12" fill="#172235"/><text x="830" y="258" font-family="Arial,sans-serif" font-size="18" fill="#86efac">3 / Return a draft</text></svg>
