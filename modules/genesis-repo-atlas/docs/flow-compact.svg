<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Repo Atlas workflow, narrow layout</title><desc id="desc">SELECT: Explicit roots → SCAN: Bounded metadata → INDEX: Source pointers → INSPECT: Relevant code</desc><rect width="1200" height="900" rx="22" fill="#0b1220"/><text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#6ee7b7" font-weight="700">HOW IT WORKS</text><rect x="48" y="106" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="152" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#6ee7b7" font-weight="700">01  SELECT</text><text x="76" y="211" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Explicit roots</text><path d="M600 260v22m-8-8 8 8 8-8" stroke="#6ee7b7" stroke-width="4" fill="none"/><rect x="48" y="289" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="335" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#6ee7b7" font-weight="700">02  SCAN</text><text x="76" y="394" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Bounded metadata</text><path d="M600 443v22m-8-8 8 8 8-8" stroke="#6ee7b7" stroke-width="4" fill="none"/><rect x="48" y="472" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="518" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#6ee7b7" font-weight="700">03  INDEX</text><text x="76" y="577" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Source pointers</text><path d="M600 626v22m-8-8 8 8 8-8" stroke="#6ee7b7" stroke-width="4" fill="none"/><rect x="48" y="655" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="701" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#6ee7b7" font-weight="700">04  INSPECT</text><text x