<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="328" viewBox="0 0 1200 328" role="img" aria-labelledby="title desc"><title id="title">Repo Atlas workflow</title><desc id="desc">SELECT: Explicit roots → SCAN: Bounded metadata → INDEX: Source pointers → INSPECT: Relevant code. An inventory is a map, not semantic understanding of every file.</desc><rect width="1200" height="328" rx="22" fill="#0b1220"/><text x="36" y="44" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6ee7b7" font-weight="700">HOW IT WORKS</text><rect x="36" y="80" width="260" height="129" rx="15" fill="#152235" stroke="#334155"/><text x="54" y="111" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6ee7b7" font-weight="700">01  SELECT</text><text x="54" y="159" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" font-weight="700">Explicit roots</text><path d="M303 145h15m-6-5 6 5-6 5" stroke="#6ee7b7" stroke-width="2" fill="none"/><rect x="325" y="80" width="260" height="129" rx="15" fill="#152235" stroke="#334155"/><text x="343" y="111" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6ee7b7" font-weight="700">02  SCAN</text><text x="343" y="159" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" font-weight="700">Bounded metadata</text><path d="M592 145h15m-6-5 6 5-6 5" stroke="#6ee7b7" stroke-width="2" fill="none"/><rect x="614" y="80" width="260" height="129" rx="15" fill="#152235" stroke="#334155"/><text x="632" y="111" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6ee7b7" font-weight="700">03  INDEX</text><text x="632" y="159" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" font-weight="700">Source pointers</text><path d="M881 145h15m-6-5 6 5-6 5" stroke="#6ee7b7" stroke-width="2" fill="none"/><rect x="903" y="80" width="260" height="129" rx="15" fill="#152235" stroke="#334155"/><text x="921" y="111" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6ee7b7" font-weight="700">04  INSPECT</text><text x="921" y="159" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#f8fafc" font-weight="700">Relevant code</text><rect x="36" y="239" width="1128" height="56" rx="12" fill="#17283a"/><text x="55" y="274" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#cbd5e1" font-weight="400">An inventory is a map, not semantic understanding of every file.</text></svg>
