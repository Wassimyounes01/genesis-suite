<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Plan Graph workflow, narrow layout</title><desc id="desc">DECLARE: Tasks and owners → VALIDATE: Dependencies → SELECT: Ready packets → DISPATCH: Within capacity</desc><rect width="1200" height="900" rx="22" fill="#0b1220"/><text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#a5b4fc" font-weight="700">HOW IT WORKS</text><rect x="48" y="106" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="152" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#a5b4fc" font-weight="700">01  DECLARE</text><text x="76" y="211" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Tasks and owners</text><path d="M600 260v22m-8-8 8 8 8-8" stroke="#a5b4fc" stroke-width="4" fill="none"/><rect x="48" y="289" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="335" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#a5b4fc" font-weight="700">02  VALIDATE</text><text x="76" y="394" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Dependencies</text><path d="M600 443v22m-8-8 8 8 8-8" stroke="#a5b4fc" stroke-width="4" fill="none"/><rect x="48" y="472" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="518" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#a5b4fc" font-weight="700">03  SELECT</text><text x="76" y="577" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Ready packets</text><path d="M600 626v22m-8-8 8 8 8-8" stroke="#a5b4fc" stroke-width="4" fill="none"/><rect x="48" y="655" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="701" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#a5b4fc" font-weight="700">04  DISPATCH</text><text x="76" y="760" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Within capacity</text></svg>
