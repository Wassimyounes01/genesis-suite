<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Paired Experiments</title><desc id="desc">Compare complete histories and keep missing costs unknown.</desc><rect width="1200" height="330" rx="24" fill="#0b1220"/><rect x="54" y="44" width="5" height="101" rx="3" fill="#fcd34d"/><text x="80" y="65" font-family="Arial,sans-serif" font-size="14" letter-spacing="4" fill="#fcd34d">GENESIS / EXPLICIT WORKFLOW TOOLS</text><text x="77" y="119" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#f8fafc">Paired Experiments</text><text x="80" y="163" font-family="Arial,sans-serif" font-size="23" fill="#cbd5e1">Compare complete histories and keep missing costs unknown.</text><rect x="80" y="220" width="320" height="62" rx="12" fill="#172235"/><text x="100" y="258" font-family="Arial,sans-serif" font-size="18" fill="#fcd34d">1 / Freeze the contract</text><rect x="445" y="220" width="320" height="62" rx="12" fill="#172235"/><text x="465" y="258" font-family="Arial,sans-serif" font-size="18" fill="#fcd34d">2 / Retain every attempt</text><rect x="810" y="220" width="320" height="62" rx="12" fill="#172235"/><text x="830" y="258" font-family="Arial,sans-serif" font-size="18" fill="#fcd34d">3 / Compare matched pairs</text></svg>
