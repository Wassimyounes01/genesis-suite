<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Review Gate workflow, narrow layout</title><desc id="desc">SUPPLY: Artifact and scope → FIND: Concrete findings → REFUTE: Challenge findings → DECIDE: Clean or unresolved</desc><rect width="1200" height="900" rx="22" fill="#0b1220"/><text x="48" y="65" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#fcd34d" font-weight="700">HOW IT WORKS</text><rect x="48" y="106" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="152" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#fcd34d" font-weight="700">01  SUPPLY</text><text x="76" y="211" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Artifact and scope</text><path d="M600 260v22m-8-8 8 8 8-8" stroke="#fcd34d" stroke-width="4" fill="none"/><rect x="48" y="289" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="335" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#fcd34d" font-weight="700">02  FIND</text><text x="76" y="394" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Concrete findings</text><path d="M600 443v22m-8-8 8 8 8-8" stroke="#fcd34d" stroke-width="4" fill="none"/><rect x="48" y="472" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="518" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#fcd34d" font-weight="700">03  REFUTE</text><text x="76" y="577" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Challenge findings</text><path d="M600 626v22m-8-8 8 8 8-8" stroke="#fcd34d" stroke-width="4" fill="none"/><rect x="48" y="655" width="1104" height="146" rx="18" fill="#152235" stroke="#334155"/><text x="76" y="701" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#fcd34d" font-weight="700">04  DECIDE</text><text x="76" y="760" font-family="Arial,Helvetica,sans-serif" font-size="42" fill="#f8fafc" font-weight="700">Clean or unresolved</text></svg>
