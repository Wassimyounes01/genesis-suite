<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Review Gate</title><desc id="desc">Incomplete is never a clean review. Keep findings, refutations and gaps visible. Require a complete result before calling it clean.</desc><rect width="1200" height="420" rx="22" fill="#0b1220"/><path d="M0 22Q0 0 22 0H1178Q1200 0 1200 22V8H0Z" fill="#fcd34d"/><text x="48" y="57" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#fcd34d" font-weight="700">GENESIS / 08    REVIEW / COMPLETENESS</text><text x="45" y="137" font-family="Arial,Helvetica,sans-serif" font-size="54" fill="#f8fafc" font-weight="700">Review Gate</text><text x="48" y="190" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#f8fafc" font-weight="700">Incomplete is never a clean review.</text><text x="48" y="236" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#cbd5e1" font-weight="400">Keep findings, refutations and gaps visible.</text><text x="48" y="269" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#cbd5e1" font-weight="400">Require a complete result before calling it clean.</text><path d="M48 307H1152" stroke="#334155"/><text x="48" y="354" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fcd34d" font-weight="700">Node.js 20+</text><text x="308" y="354" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fcd34d" font-weight="700">Offline examples</text><text x="568" y="354" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#fcd34d" font-weight="700">MIT licensed</text><text x="48" y="390" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#94a3b8" font-weight="400">Small components. Explicit controls. Evidence you can inspect.</text><rect x="991" y="94" width="160" height="160" rx="26" fill="#fcd34d" fill-opacity=".10" stroke="#fcd34d" stroke-opacity=".4"/><text x="1021" y="193" font-family="Arial,Helvetica,sans-serif" font-size="72" fill="#fcd34d" font-weight="700">08</text></svg>
